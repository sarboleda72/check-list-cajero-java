<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist de Proyecto de Cajero Automático</title>
    <link rel="stylesheet" href="assets/styles/styles.css">
</head>
<body>

    <h1>Checklist del Proyecto</h1>

    <form id="checklistForm">
        <fieldset>
            <legend>1. Gestión de Usuarios</legend>
            <label><input type="checkbox" name="requisito"> El sistema permite crear usuarios con la información relevante.</label>
            <label><input type="checkbox" name="requisito"> Cada usuario tiene acceso a su propio entorno de trabajo o configuración.</label>
            <label><input type="checkbox" name="requisito"> Se puede iniciar y cerrar sesión correctamente.</label>
        </fieldset>

        <fieldset>
            <legend>2. Funcionalidades Principales</legend>
            <label><input type="checkbox" name="requisito"> Se implementan las funciones clave del proyecto según sus objetivos.</label>
            <label><input type="checkbox" name="requisito"> Las acciones principales funcionan correctamente.</label>
            <label><input type="checkbox" name="requisito"> El sistema maneja adecuadamente los diferentes estados.</label>
        </fieldset>

        <fieldset>
            <legend>3. Gestión de Datos</legend>
            <label><input type="checkbox" name="requisito"> Se pueden almacenar y recuperar datos de manera correcta.</label>
            <label><input type="checkbox" name="requisito"> Se implementa validación para evitar datos incorrectos o incompletos.</label>
            <label><input type="checkbox" name="requisito"> Las transacciones o cambios en datos se reflejan correctamente.</label>
        </fieldset>

        <fieldset>
            <legend>4. Interacción con el Usuario</legend>
            <label><input type="checkbox" name="requisito"> La interfaz permite una interacción clara y fluida.</label>
            <label><input type="checkbox" name="requisito"> Se han implementado mensajes de confirmación o error según sea necesario.</label>
            <label><input type="checkbox" name="requisito"> Se manejan correctamente los distintos roles o permisos.</label>
        </fieldset>

        <fieldset>
            <legend>5. Historial y Registro</legend>
            <label><input type="checkbox" name="requisito"> Se mantiene un historial o registro de las acciones importantes.</label>
            <label><input type="checkbox" name="requisito"> El usuario puede consultar información sobre eventos pasados.</label>
        </fieldset>

        <fieldset>
            <legend>6. Seguridad y Manejo de Errores</legend>
            <label><input type="checkbox" name="requisito"> Se validan correctamente las credenciales al iniciar sesión.</label>
            <label><input type="checkbox" name="requisito"> Se han considerado medidas de seguridad básicas para el manejo de datos.</label>
            <label><input type="checkbox" name="requisito"> Se muestran mensajes adecuados cuando ocurre un error.</label>
        </fieldset>

        <fieldset>
            <legend>7. Pruebas y Validación</legend>
            <label><input type="checkbox" name="requisito"> Se han realizado pruebas funcionales para verificar el correcto desempeño.</label>
            <label><input type="checkbox" name="requisito"> Se han corregido errores detectados durante las pruebas.</label>
            <label><input type="checkbox" name="requisito"> Se ha recibido feedback y se han aplicado mejoras basadas en ello.</label>
        </fieldset>

        <button type="button" onclick="calcularNota()">Comprobar</button>
        
        <div id="resultado"></div>
    </form>
</body>
<script src="assets/js/script.js"></script>
</html>
